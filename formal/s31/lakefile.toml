name = "s31-formal"
version = "0.1.0"
defaultTargets = ["S31"]

[[require]]
name = "riscv-refinement"
path = "../riscv-refinement"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8a178386ffc0f5fef0b77738bb5449d50efeea95"

[[lean_lib]]
name = "S31"
globs = ["S31", "S31.+"]

[[lean_exe]]
name = "s31-check"
root = "S31.Check"

[[lean_exe]]
name = "s31-alias-relation-check"
root = "S31.Audit.AliasRelationCheck"

[[lean_exe]]
name = "s31-source-function-check"
root = "S31.Audit.SourceFunctionCheck"

[[lean_exe]]
name = "s31-general-linear-certificate-check"
root = "S31.Audit.GeneralLinearSSACertificateCheck"

[[lean_exe]]
name = "s31-general-linear-effects-certificate-check"
root = "S31.Audit.GeneralLinearSSAEffectsCertificateCheck"
