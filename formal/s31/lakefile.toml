name = "s31-formal"
version = "0.1.0"
defaultTargets = ["S31"]

[[require]]
name = "riscv-refinement"
path = "../riscv-refinement"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8a178386ffc0f5fef0b77738bb5449d50efeea95"

[[lean_lib]]
name = "S31"
globs = ["S31", "S31.+"]

[[lean_exe]]
name = "s31-check"
root = "S31.Check"

[[lean_exe]]
name = "s31-alias-relation-check"
root = "S31.Audit.AliasRelationCheck"

[[lean_exe]]
name = "s31-source-function-check"
root = "S31.Audit.SourceFunctionCheck"

[[lean_exe]]
name = "s31-general-linear-certificate-check"
root = "S31.Audit.GeneralLinearSSACertificateCheck"

[[lean_exe]]
name = "s31-general-linear-effects-certificate-check"
root = "S31.Audit.GeneralLinearSSAEffectsCertificateCheck"

[[lean_exe]]
name = "s31-general-linear-source-check"
root = "S31.Audit.GeneralLinearSSASourceCheck"

[[lean_exe]]
name = "s31-general-linear-effects-source-check"
root = "S31.Audit.GeneralLinearSSAEffectsSourceCheck"

[[lean_exe]]
name = "s31-general-linear-public-abi-check"
root = "S31.Audit.GeneralLinearSSAPublicABICheck"

[[lean_exe]]
name = "s31-general-linear-byte-run-check"
root = "S31.Audit.GeneralLinearSSAByteRunCheck"

[[lean_exe]]
name = "s31-general-linear-effects-byte-run-check"
root = "S31.Audit.GeneralLinearSSAEffectsByteRunCheck"

[[lean_exe]]
name = "s31-general-linear-effects-package-check"
root = "S31.Audit.GeneralLinearSSAEffectsPackageCheck"

[[lean_exe]]
name = "s31-general-linear-structural-check"
root = "S31.Audit.GeneralLinearSSAStructuralDerivationCheck"

[[lean_exe]]
name = "s31-structural-native-trace-check"
root = "S31.Audit.StructuralNativeTraceDecoderCheck"

[[lean_exe]]
name = "s31-structural-native-gate-ownership-check"
root = "S31.Audit.StructuralNativeGateOwnershipCheck"

[[lean_exe]]
name = "s31-structural-native-fixed-constant-check"
root = "S31.Audit.StructuralNativeFixedConstantCheck"

[[lean_exe]]
name = "s31-pure-field-derivation-bytes-check"
root = "S31.Audit.PureFieldDerivationBytesCheck"

[[lean_exe]]
name = "s31-general-record-v2-source-check"
root = "S31.Audit.GeneralRecordV2SourceCheck"

[[lean_exe]]
name = "s31-general-record-v2-program-admission-check"
root = "S31.Audit.GeneralRecordV2ProgramAdmissionCheck"
