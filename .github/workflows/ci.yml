      - name: Native nine-component engine proof and adversarial controls
        working-directory: deps/stwo-zig
        run: zig build --build-file src/integrations/circuit_cpu/build.zig test -Doptimize=ReleaseFast -Dtest-filter='mixed N=4 native proof' -j1 --summary all
      - name: Source-derived N4 roster and witness handoffs
