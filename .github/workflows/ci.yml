      - name: Functional arithmetic, recurrence, and wide native proofs
        run: |
          set -euo pipefail
          mkdir -p zig-out/s31/acceptance
          python3 src/frontends/s31/tests/acceptance/acceptance_functional_core.py |
            tee zig-out/s31/acceptance/functional-core.json
