name: S31

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s31-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Verify pinned engine
        run: |
          test -z "$(git submodule status | grep '^[-+]')"
          test -z "$(git -C deps/stwo-zig status --porcelain --untracked-files=no)"
      - name: Zig compiler and proof tests
        run: cd src/frontends/s31 && zig build test -Doptimize=ReleaseSafe -j2
      - name: Text frontend and oracle tests
        run: python3 -m unittest discover -s src/frontends/s31/tests/python -p 'test_*.py' -q
      - name: Documentation consistency
        run: python3 src/frontends/s31/docs/check.py
      - name: Native proof smoke
        run: |
          python3 src/frontends/s31/python/s31.py trial \
            src/frontends/s31/examples/hashes/preimage4.s31 \
            src/frontends/s31/examples/hashes/preimage4.valid.json \
            --lowering gate --out zig-out/s31/ci-preimage-trial

  functional-native-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Verify pinned engine
        run: |
          test -z "$(git submodule status | grep '^[-+]')"
          test -z "$(git -C deps/stwo-zig status --porcelain --untracked-files=no)"
      - name: Functional arithmetic, recurrence, and wide native proofs
        run: |
          set -euo pipefail
          mkdir -p zig-out/s31/acceptance
          python3 src/frontends/s31/tests/acceptance/acceptance_functional_core.py |
            tee zig-out/s31/acceptance/functional-core.json
      - name: Field and byte conditional native proofs
        run: |
          set -euo pipefail
          python3 src/frontends/s31/tests/acceptance/acceptance_total_if.py |
            tee zig-out/s31/acceptance/total-if.json
      - name: Nominal record zero-cost and native proof gate
        run: |
          set -euo pipefail
          python3 src/frontends/s31/tests/acceptance/acceptance_records.py |
            tee zig-out/s31/acceptance/records.json
      - name: Whole-product selection native proof and AIR-cost gate
        run: |
          set -euo pipefail
          python3 src/frontends/s31/tests/acceptance/functional/product_control.py |
            tee zig-out/s31/acceptance/product-control.json
      - name: Preserve native acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s31-functional-native-evidence
          path: zig-out/s31/acceptance/
          if-no-files-found: warn

