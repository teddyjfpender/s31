  experimental-mixed-general-boundary-native-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Verify pinned engine
        run: |
          test -z "$(git submodule status | grep '^[-+]')"
          test -z "$(git -C deps/stwo-zig status --porcelain --untracked-files=no)"
      - name: Native engine proof for every mixed call count
        working-directory: deps/stwo-zig
        run: zig build --build-file src/integrations/circuit_cpu/build.zig test -Doptimize=ReleaseFast -Dtest-filter='general mixed native proof' -j1 --summary all
      - name: Sealed source-pinned proof for every mixed call count
        working-directory: src/frontends/s31
        run: zig build test-mixed-general-native -Doptimize=ReleaseFast -j1 --summary all
      - name: Selected private feeder and registry integrity controls
        working-directory: src/frontends/s31
        run: zig build test-mixed-registry test-mixed-selected-feeder -Doptimize=ReleaseFast -j1 --summary all
      - name: Black-box source, manifest, claim, and statement controls
        run: |
          set -euo pipefail
          mkdir -p zig-out/s31/acceptance
          python3 src/frontends/s31/tests/acceptance/mixed_boundary/source_pinned_general.py |
            tee zig-out/s31/acceptance/mixed-general-source-pinned.json
      - name: Public record ABI v2 native proof controls
        run: |
          set -euo pipefail
          python3 src/frontends/s31/tests/acceptance/mixed_boundary/record_general_v2.py |
            tee zig-out/s31/acceptance/mixed-general-record-v2.json
      - name: Preserve general mixed boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s31-experimental-mixed-general-boundary-evidence
          path: zig-out/s31/acceptance/
          if-no-files-found: warn

