name: S31

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s31-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Verify pinned engine
        run: |
          test -z "$(git submodule status | grep '^[-+]')"
          test -z "$(git -C deps/stwo-zig status --porcelain --untracked-files=no)"
      - name: Zig compiler and proof tests
        run: cd src/frontends/s31 && zig build test -Doptimize=ReleaseSafe -j2
      - name: Text frontend and oracle tests
        run: python3 -m unittest discover -s src/frontends/s31/tests/python -p 'test_*.py' -q
      - name: Fixed-width integer source and independent oracle matrix
        run: |
          python3 src/frontends/s31/tests/acceptance/math/addition.py --source-only > /dev/null
          python3 src/frontends/s31/tests/acceptance/math/direct_binary.py > /dev/null
          python3 src/frontends/s31/tests/acceptance/math/direct_multiplication.py > /dev/null
      - name: Mixed stage cost protocol checks
        run: |
          python3 -B src/frontends/s31/benchmarks/mixed_stage_cost_v1/cohort.py
          python3 -B src/frontends/s31/benchmarks/mixed_stage_cost_v1/test_static.py
          python3 -B src/frontends/s31/benchmarks/paired_record_v2/test_diagnose_stages_v1.py
          python3 -B -m unittest discover -s src/frontends/s31/benchmarks/direct_gate_release_cost -p 'test_*.py' -q
      - name: Documentation consistency
        run: python3 src/frontends/s31/docs/check.py
      - name: Release archive and profile controls
        run: |
          python3 -B -m unittest scripts.tests.test_source_bundle -q
          python3 -B -m unittest scripts.tests.test_s31_v01_release_audit -q
          python3 -B -m unittest scripts.tests.test_pcs_fri_order -q
          python3 -B -m unittest scripts.tests.test_pcs_fri_projection -q
      - name: Native proof smoke
        run: |
          python3 src/frontends/s31/python/s31.py trial \
            src/frontends/s31/examples/hashes/preimage4.s31 \
            src/frontends/s31/examples/hashes/preimage4.valid.json \
            --lowering gate --out zig-out/s31/ci-preimage-trial

