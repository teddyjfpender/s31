name: S31 Lean semantics and gadget proofs

on:
  pull_request:
    paths:
      - 'formal/s31/**'
      - 'deps/stwo-zig'
      - 'src/frontends/s31/**'
      - 'scripts/s31_formal*'
      - 'scripts/s31_formal_lib/**'
      - 'scripts/tests/test_s31_formal.py'
      - '.github/workflows/s31-formal.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'src/frontends/s31/**'
      - 'deps/stwo-zig'
      - 'scripts/**'
      - '.github/workflows/s31-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s31-formal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantics-and-gadgets:
    runs-on: ubuntu-latest
    # This full proof tree reached 6,919/6,946 build tasks at the former
    # 60-minute limit on a hosted runner, before kernel replay began. Leave
    # enough time for both the build and the independent kernel check.
    timeout-minutes: 150
    env:
      # leanchecker otherwise imports a Mathlib environment per concurrent
      # module. One worker preserves the same kernel checks with bounded RAM.
      LEAN_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Zig for native AIR tree export
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          # The restored shared cache has reported the exporter executable as
          # built while omitting the file itself. This job compiles one small
          # exporter; a clean cache is more valuable than a stale cache hit.
          use-cache: false
      - name: Source bindings, coverage, and proof-escape checks
        run: |
          set -euo pipefail
          mkdir -p zig-out/s31/formal
          python3 scripts/s31_formal.py | tee zig-out/s31/formal/source-checks.log
          python3 -m unittest scripts.tests.test_s31_formal 2>&1 | tee -a zig-out/s31/formal/source-checks.log
      - name: Check pinned square4 native base rows and mutation controls
        run: |
          set -euo pipefail
          python3 formal/s31/scripts/check_square4_native_witness.py \
            --report formal/s31/fixtures/square4-native-physical.json \
            --controls \
            --write-lean zig-out/s31/formal/TextSquare4NativeWitness.lean \
            | tee zig-out/s31/formal/square4-native-witness.log
          cmp zig-out/s31/formal/TextSquare4NativeWitness.lean \
            formal/s31/S31/Gadgets/Functional/TextSquare4NativeWitness.lean
      - name: Pinned Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/s31
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Verify toolchain and fetch pinned Mathlib cache
        working-directory: formal/s31
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.29.0'
          lake env lean --version | grep -E '^Lean \(version 4\.29\.0,'
          lake exe cache get Mathlib.Data.ZMod.Basic Mathlib.Tactic Mathlib.NumberTheory.LucasLehmer
      - name: Build every proof source and executable semantics
        working-directory: formal/s31
        run: lake build S31 S31.Evidence.AxiomAudit s31-check s31-alias-relation-check s31-source-function-check s31-general-linear-certificate-check
      - name: Lean linear SSA certificate byte controls
        working-directory: formal/s31
        run: python3 tests/audit/general_linear_ssa_certificate.py
      - name: Exercise the proved source and normalized-relation checker
        working-directory: formal/s31
        run: python3 -m unittest discover -s tests -p 'test_alias_relation_check.py' -q
      - name: Compare named-function source and exact relation bytes with Lean
        working-directory: formal/s31
        run: python3 -m unittest discover -s tests/audit -p 'test_source_function_check.py' -q
      - name: Join checked functional canonical IR with fresh native identities
        run: |
          set -euo pipefail
          python3 formal/s31/tests/audit/native_canonical_digest.py |
            tee zig-out/s31/formal/source-function-native-digest.json
      - name: Check pinned record source and canonical ABI bytes
        working-directory: formal/s31
        run: python3 -m unittest discover -s tests -p 'test_record_pair_alias_check.py' -q
      - name: Audit all theorem axioms and replay all package modules in the kernel
        working-directory: formal/s31
        run: |
          set -euo pipefail
          mkdir -p ../../zig-out/s31/formal
          lake env lean S31/Evidence/AxiomAudit.lean > ../../zig-out/s31/formal/axioms.log
          lake env leanchecker -v S31 S31.Evidence.AxiomAudit RiscvRefinement.Field.M31 RiscvRefinement.Recursion.CompactPoseidon > ../../zig-out/s31/formal/kernel.log
      - name: Independent semantics, false witnesses, and real gadget mutations
        run: |
          python3 scripts/s31_formal.py \
            --audit zig-out/s31/formal/axioms.log \
            --kernel-log zig-out/s31/formal/kernel.log \
            --parity formal/s31/.lake/build/bin/s31-check \
            --controls --report zig-out/s31/formal/evidence.json
      - name: Preserve live formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s31-formal-evidence
          path: zig-out/s31/formal/
          if-no-files-found: error

  fresh-native-square4-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Zig for fresh native square4 package
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          use-cache: false
      - name: Rebuild, export, compare, and mutate complete square4 base trace
        run: |
          set -euo pipefail
          mkdir -p zig-out/s31/formal/fresh-square4
          python3 formal/s31/scripts/check_fresh_square4_native_witness.py \
            --write-report zig-out/s31/formal/fresh-square4/native-physical.json \
            --write-lean zig-out/s31/formal/fresh-square4/TextSquare4NativeWitness.lean \
            2>&1 | tee zig-out/s31/formal/fresh-square4/check.log
      - name: Preserve fresh native trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s31-fresh-native-square4-trace
          path: zig-out/s31/formal/fresh-square4/
          if-no-files-found: warn

  fresh-native-ordered-subtraction-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Zig for ordered subtraction native package
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          use-cache: false
      - name: Rebuild and compare sealed ordered subtraction source rows
        run: |
          set -euo pipefail
          mkdir -p zig-out/s31/formal/ordered-subtraction
          python3 src/frontends/s31/tools/formal/ordered_subtraction_native_fixture.py \
            --native 2>&1 | tee zig-out/s31/formal/ordered-subtraction/check.log
      - name: Preserve ordered subtraction native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s31-fresh-native-ordered-subtraction-rows
          path: zig-out/s31/formal/ordered-subtraction/
          if-no-files-found: warn
